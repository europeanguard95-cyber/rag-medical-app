# .github/workflows/tests.yml
# Lance les 42 tests automatiquement à chaque push ou Pull Request.
# Les dépendances externes (Groq, Pinecone, etc.) sont mockées : pas de clé API nécessaire.

name: Tests RAG

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances de test
        run: pip install pytest numpy

      - name: Lancer les tests
        run: pytest test_chunker.py test_auth.py test_pipeline.py -v
